services:
  postgres:
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    ports: !reset []
    logging:
      driver: json-file
      options:
        max-size: 100m
        max-file: '10'

  redis:
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD}
    command: ['sh', '-c', 'exec redis-server --requirepass "$REDIS_PASSWORD"']
    ports: !reset []
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli -a "$$REDIS_PASSWORD" ping | grep -q PONG']
    logging:
      driver: json-file
      options:
        max-size: 100m
        max-file: '10'

  mailpit:
    profiles: ['local']
    ports: !reset []

  minio:
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
      MINIO_DEFAULT_BUCKETS: ${MINIO_BUCKET:-novel-brain}
    ports: !reset []
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'mc alias set local http://localhost:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" >/dev/null && mc ls local/$${MINIO_BUCKET:-novel-brain} >/dev/null',
        ]
    logging:
      driver: json-file
      options:
        max-size: 100m
        max-file: '10'

  api:
    environment:
      NODE_ENV: production
      WEB_URL: ${PUBLIC_WEB_URL:?set PUBLIC_WEB_URL}
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL}
      DATABASE_ADMIN_URL: ${DATABASE_ADMIN_URL:?set DATABASE_ADMIN_URL}
      ALLOW_DEFAULT_DB_PASSWORD: 'false'
      REDIS_URL: ${REDIS_URL:?set REDIS_URL}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-http://minio:9000}
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET:-novel-brain}
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET}
      MODEL_KEY_ENCRYPTION_KEY: ${MODEL_KEY_ENCRYPTION_KEY:?set MODEL_KEY_ENCRYPTION_KEY}
      DOWNLOAD_SIGNING_SECRET: ${DOWNLOAD_SIGNING_SECRET:?set DOWNLOAD_SIGNING_SECRET}
      DOWNLOAD_URL_TTL_SECONDS: ${DOWNLOAD_URL_TTL_SECONDS:-300}
      SMTP_HOST: ${SMTP_HOST:?set SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:?set SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD:?set SMTP_PASSWORD}
      SMTP_FROM: ${SMTP_FROM:?set SMTP_FROM}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_REQUIRE_TLS: ${SMTP_REQUIRE_TLS:-true}
      SMTP_REJECT_UNAUTHORIZED: ${SMTP_REJECT_UNAUTHORIZED:-true}
      SMTP_TLS_MIN_VERSION: ${SMTP_TLS_MIN_VERSION:-TLSv1.2}
      COOKIE_SECURE: 'true'
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-1}
      LOG_FORMAT: json
      LOG_RETENTION_DAYS: ${LOG_RETENTION_DAYS:-30}
      ENCRYPTION_AT_REST_CONFIRMED: ${ENCRYPTION_AT_REST_CONFIRMED:?set ENCRYPTION_AT_REST_CONFIRMED}
      OFFSITE_BACKUP_CONFIRMED: ${OFFSITE_BACKUP_CONFIRMED:?set OFFSITE_BACKUP_CONFIRMED}
    command: sh -c "pnpm --filter @novel/db db:migrate && pnpm --filter @novel/db db:seed && node scripts/ensure-app-role-password.mjs && node apps/api/dist/main.js"
    depends_on: !override
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    ports: !reset []
    logging:
      driver: json-file
      options:
        max-size: 100m
        max-file: '10'

  worker:
    environment:
      NODE_ENV: production
      WEB_URL: ${PUBLIC_WEB_URL:?set PUBLIC_WEB_URL}
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL}
      DATABASE_ADMIN_URL: ${DATABASE_ADMIN_URL:?set DATABASE_ADMIN_URL}
      ALLOW_DEFAULT_DB_PASSWORD: 'false'
      REDIS_URL: ${REDIS_URL:?set REDIS_URL}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-http://minio:9000}
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET:-novel-brain}
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET}
      MODEL_KEY_ENCRYPTION_KEY: ${MODEL_KEY_ENCRYPTION_KEY:?set MODEL_KEY_ENCRYPTION_KEY}
      DOWNLOAD_SIGNING_SECRET: ${DOWNLOAD_SIGNING_SECRET:?set DOWNLOAD_SIGNING_SECRET}
      DOWNLOAD_URL_TTL_SECONDS: ${DOWNLOAD_URL_TTL_SECONDS:-300}
      SMTP_HOST: ${SMTP_HOST:?set SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:?set SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD:?set SMTP_PASSWORD}
      SMTP_FROM: ${SMTP_FROM:?set SMTP_FROM}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_REQUIRE_TLS: ${SMTP_REQUIRE_TLS:-true}
      SMTP_REJECT_UNAUTHORIZED: ${SMTP_REJECT_UNAUTHORIZED:-true}
      SMTP_TLS_MIN_VERSION: ${SMTP_TLS_MIN_VERSION:-TLSv1.2}
      COOKIE_SECURE: 'true'
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-1}
      LOG_FORMAT: json
      LOG_RETENTION_DAYS: ${LOG_RETENTION_DAYS:-30}
      ENCRYPTION_AT_REST_CONFIRMED: ${ENCRYPTION_AT_REST_CONFIRMED:?set ENCRYPTION_AT_REST_CONFIRMED}
      OFFSITE_BACKUP_CONFIRMED: ${OFFSITE_BACKUP_CONFIRMED:?set OFFSITE_BACKUP_CONFIRMED}
    logging:
      driver: json-file
      options:
        max-size: 100m
        max-file: '10'

  web:
    ports: !reset []
    logging:
      driver: json-file
      options:
        max-size: 100m
        max-file: '10'

  caddy:
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?set APP_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL}
    volumes: !override
      - ./infra/caddy/Caddyfile.production:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
      - caddy-logs:/var/log/caddy
    ports: !override
      - '80:80'
      - '443:443'
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:2019/config/ >/dev/null']
    logging:
      driver: json-file
      options:
        max-size: 100m
        max-file: '10'

volumes:
  caddy-logs:
