name: Deployment Smoke

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/deployment-smoke.yml"
      - "apps/**"
      - "infra/**"
      - "packages/**"
      - "scripts/deployment-guardrails.mjs"
      - "scripts/observability-guardrails.mjs"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"

jobs:
  compose-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12.15.0
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - name: Validate production overlay
        run: docker compose --env-file .env.production.example -f infra/docker/compose.yml -f infra/docker/compose.production.yml config --quiet
      - run: docker compose -f infra/docker/compose.yml config --quiet
      - name: Start production overlay
        env:
          APP_ORIGIN: http://localhost
        run: docker compose --env-file .env.production.example -f infra/docker/compose.yml -f infra/docker/compose.production.yml up -d --build --wait --wait-timeout 900
      - name: Validate Prometheus configuration
        run: docker run --rm --entrypoint /bin/promtool -v "$PWD/infra/observability:/etc/prometheus:ro" prom/prometheus:v3.5.0 check config /etc/prometheus/prometheus.yml
      - name: Test Prometheus alert rules
        run: docker run --rm --entrypoint /bin/promtool -v "$PWD/infra/observability:/etc/prometheus:ro" prom/prometheus:v3.5.0 test rules /etc/prometheus/alerts.test.yml
      - name: Verify public Caddy entry
        run: curl --fail --silent --show-error http://localhost/health
      - name: Verify production model-key encryption
        run: docker compose --env-file .env.production.example -f infra/docker/compose.yml -f infra/docker/compose.production.yml exec -T worker node -e "const { encryptApiKey, decryptApiKey } = require('/app/packages/ai/dist/index.js'); const value = 'production-smoke-key'; if (decryptApiKey(encryptApiKey(value)) !== value) process.exit(1);"
      - name: Smoke production services
        run: docker compose --env-file .env.production.example -f infra/docker/compose.yml -f infra/docker/compose.production.yml exec -T -e API_URL=http://api:3001 -e WEB_URL=http://web:3000 -e MAILPIT_URL=http://mailpit:8025 -e METRICS_URL=http://api:3001/api/v1/metrics -e STORAGE_HEALTH_URL=http://minio:9000/minio/health/live -e REDIS_URL=redis://redis:6379 worker node apps/worker/scripts/stack-smoke.mjs
      - name: Capture deployment evidence
        if: always()
        run: docker compose --env-file .env.production.example -f infra/docker/compose.yml -f infra/docker/compose.production.yml ps
      - name: Dump compose logs
        if: failure()
        run: docker compose --env-file .env.production.example -f infra/docker/compose.yml -f infra/docker/compose.production.yml logs --no-color
      - name: Stop stack
        if: always()
        run: docker compose --env-file .env.production.example -f infra/docker/compose.yml -f infra/docker/compose.production.yml down --remove-orphans
