name: Provider Smoke

on:
  workflow_dispatch:
    inputs:
      model:
        description: "DeepSeek model"
        required: true
        default: "deepseek-chat"
        type: string
      prompt_version:
        description: "Prompt version identifier"
        required: true
        default: "m1-writing-prompts-v1"
        type: string
      max_budget_cny:
        description: "Maximum smoke budget in CNY"
        required: true
        default: "0.01"
        type: string

permissions:
  contents: read

jobs:
  deepseek-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: provider-smoke
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12.15.0
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Run gated real-provider smoke
        env:
          REQUIRE_DEEPSEEK_SMOKE: "1"
          DEEPSEEK_SMOKE_ENABLED: "1"
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_SMOKE_MODEL: ${{ inputs.model }}
          DEEPSEEK_SMOKE_PROMPT_VERSION: ${{ inputs.prompt_version }}
          DEEPSEEK_SMOKE_MAX_BUDGET_CNY: ${{ inputs.max_budget_cny }}
          DEEPSEEK_SMOKE_MAX_ATTEMPTS: "2"
          DEEPSEEK_SMOKE_TIMEOUT_MS: "15000"
          DEEPSEEK_SMOKE_OUTPUT: artifacts/provider/deepseek-smoke.json
        run: pnpm smoke:deepseek

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: provider-smoke-evidence
          path: artifacts/provider/deepseek-smoke.json
          if-no-files-found: error
