name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.20.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Start test services
        run: docker compose up -d --wait postgres redis mailpit minio
      - name: Apply database migrations
        env:
          DATABASE_URL: postgres://novel:novel@localhost:5432/novel
        run: pnpm db:migrate
      - run: pnpm lint
      - run: pnpm typecheck
      - name: Run unit and integration tests
        env:
          NODE_ENV: test
          DATABASE_URL: postgres://novel:novel@localhost:5432/novel
          REDIS_URL: redis://localhost:6379
          MINIO_ENDPOINT: http://localhost:9000
          MINIO_ACCESS_KEY: minio
          MINIO_SECRET_KEY: minio123
          MINIO_BUCKET: novel-brain
          SMTP_HOST: localhost
          SMTP_PORT: '1025'
          SESSION_SECRET: ci-session-secret
          MODEL_KEY_ENCRYPTION_KEY: ABEiM0RVZneImaq7zN3u/wARIjNEVWZ3iJmqu8zd7v8=
          COOKIE_SECURE: 'false'
          AI_PROVIDER: fake
        run: pnpm exec vitest run --maxWorkers=4
      - run: pnpm build
      - run: pnpm deploy:check
      - run: pnpm deploy:smoke
      - run: docker compose config

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.20.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Start fake-provider stack
        env:
          AI_PROVIDER: fake
        run: docker compose up -d --build --wait postgres redis mailpit minio api worker web
      - name: Run browser acceptance
        env:
          PLAYWRIGHT_SKIP_WEBSERVER: '1'
        run: pnpm test:e2e
      - name: Stop the stack
        if: always()
        run: docker compose down -v

  compose-smoke:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start the stack
        run: docker compose up -d --build
      - name: Wait for readiness
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost/api/v1/health/ready; then
              exit 0
            fi
            sleep 5
          done
          docker compose logs
          exit 1
      - name: Verify worker result
        run: |
          count=$(docker compose exec -T postgres psql -U novel -d novel -tAc "select count(*) from system_jobs where status = 'completed';")
          test "$count" -ge 2
      - name: Stop the stack
        if: always()
        run: docker compose down -v
