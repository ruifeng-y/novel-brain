name: Production CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: novelbrain
          POSTGRES_USER: novelbrain
          POSTGRES_PASSWORD: novelbrain
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U novelbrain -d novelbrain"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      TEST_DATABASE_URL: postgresql://novelbrain:novelbrain@localhost:5432/novelbrain_test
      REDIS_URL: redis://localhost:6379
      AUTH_SECRET: ci-auth-secret
      APP_ORIGIN: http://localhost:3000

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12.15.0
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm --filter @novel-brain/api openapi:check
      - run: pnpm test
      - run: pnpm test:integration
      - run: pnpm build

  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: novelbrain
          POSTGRES_USER: novelbrain
          POSTGRES_PASSWORD: novelbrain
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U novelbrain -d novelbrain"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
      mailpit:
        image: axllent/mailpit:v1.33.0
        ports:
          - 1025:1025
          - 8025:8025
    env:
      E2E_DATABASE_URL: postgresql://novelbrain:novelbrain@localhost:5432/novelbrain
      REDIS_URL: redis://localhost:6379

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12.15.0
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-evidence
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
