name: Production CI

on:
  workflow_dispatch:
    inputs:
      update_golden:
        description: "Update production golden screenshots"
        required: false
        default: false
        type: boolean
  pull_request:
  push:
    branches:
      - main

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: novelbrain
          POSTGRES_USER: novelbrain
          POSTGRES_PASSWORD: novelbrain
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U novelbrain -d novelbrain"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      TEST_DATABASE_URL: postgresql://novelbrain:novelbrain@localhost:5432/novelbrain_test
      TEST_REDIS_URL: redis://localhost:6379/2
      AUTH_SECRET: ci-auth-secret
      APP_ORIGIN: http://localhost:3000

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: pnpm/action-setup@v4
        with:
          version: 12.15.0
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - name: Validate PR guardrails
        if: github.event_name == 'pull_request'
        run: node scripts/check-pr-guardrails.mjs --base ${{ github.event.pull_request.base.sha }} --head HEAD
      - name: Validate push commit messages
        if: github.event_name == 'push'
        run: node scripts/validate-commits.mjs --base ${{ github.event.before }} --head HEAD
      - run: pnpm check:migrations
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm --filter @novel-brain/api openapi:check
      - run: pnpm test
      - run: pnpm test:integration
      - run: pnpm build

  playwright:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: novelbrain
          POSTGRES_USER: novelbrain
          POSTGRES_PASSWORD: novelbrain
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U novelbrain -d novelbrain"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
      mailpit:
        image: axllent/mailpit:v1.33.0
        ports:
          - 1025:1025
          - 8025:8025
    env:
      E2E_DATABASE_URL: postgresql://novelbrain:novelbrain@localhost:5432/novelbrain_e2e
      E2E_REDIS_URL: redis://localhost:6379/1

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12.15.0
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Update production golden screenshots
        if: github.event_name == 'workflow_dispatch' && inputs.update_golden == true
        run: pnpm test:e2e:update

      - name: Run Playwright
        if: github.event_name != 'workflow_dispatch' || inputs.update_golden != true
        run: pnpm test:e2e

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-evidence
          path: |
            playwright-report
            test-results
            artifacts/ui/golden
          if-no-files-found: ignore
