global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: novelbrain-api
    metrics_path: /api/v1/metrics
    static_configs:
      - targets: ["api:3001"]
  - job_name: novelbrain-minio
    metrics_path: /minio/v2/metrics/cluster
    static_configs:
      - targets: ["minio:9000"]
