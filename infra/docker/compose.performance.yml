services:
  postgres:
    ports: !override
      - '55432:5432'

  redis:
    ports: !override
      - '56379:6379'

  mailpit:
    ports: !override
      - '8025:8025'

  minio:
    ports: !override
      - '19000:9000'
      - '19001:9001'

  api:
    ports: !override
      - '13001:3001'
    environment:
      AI_PROVIDER: fake

  worker:
    environment:
      AI_PROVIDER: fake
      WORKER_CONCURRENCY: '4'
      GENERATION_GLOBAL_CONCURRENCY: '4'
      GENERATION_USER_CONCURRENCY: '2'
      GENERATION_WORK_CONCURRENCY: '2'
      GENERATION_DEFER_MS: '250'

  web:
    ports: !override
      - '13000:3000'

  caddy:
    ports: !override
      - '18080:80'
      - '18443:443'
