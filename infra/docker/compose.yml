name: novel-brain-m0

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: novelbrain
      POSTGRES_USER: novelbrain
      POSTGRES_PASSWORD: novelbrain
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U novelbrain -d novelbrain"]
      interval: 5s
      timeout: 3s
      retries: 12

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  mailpit:
    image: axllent/mailpit:v1.33.0
    ports:
      - "1025:1025"
      - "8025:8025"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8025/api/v1/info"]
      interval: 5s
      timeout: 3s
      retries: 12

  fake-ai-smoke:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile
      target: api
    command: ["node", "packages/ai/dist/smoke.js"]
    restart: "no"

  migrate:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile
      target: api
    command: ["node", "packages/db/dist/migrate.js"]
    environment:
      DATABASE_URL: postgresql://novelbrain:novelbrain@postgres:5432/novelbrain
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile
      target: api
    environment:
      NODE_ENV: development
      API_PORT: 3001
      DATABASE_URL: postgresql://novelbrain:novelbrain@postgres:5432/novelbrain
      REDIS_URL: redis://redis:6379
      AUTH_SECRET: local-development-auth-secret-change-me
      PROXY_IP_SECRET: local-development-proxy-ip-secret
      ALLOW_INSECURE_LOCAL_PROXY_IP: "true"
      APP_ORIGIN: http://localhost:3000
      COOKIE_SECURE: "false"
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      MAIL_FROM: 墨舟 <no-reply@novelbrain.local>
      MODEL_CONFIG_ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef
      ALLOW_INSECURE_LOCAL_MODEL_KEY: "true"
      MODEL_PROVIDER_ALLOWLIST: https://api.openai.com/v1
    ports:
      - "127.0.0.1:3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/api/v1/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 20

  worker:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile
      target: worker
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://novelbrain:novelbrain@postgres:5432/novelbrain
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "apps/worker/dist/readiness-cli.js"]
      interval: 5s
      timeout: 5s
      retries: 20

  web:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile
      target: web
    environment:
      NODE_ENV: production
      API_INTERNAL_URL: http://api:3001
      PROXY_IP_SECRET: local-development-proxy-ip-secret
      ALLOW_INSECURE_LOCAL_PROXY_IP: "true"
      TRUST_PROXY_HEADERS: "true"
    expose:
      - "3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 20

  caddy:
    image: caddy:2-alpine
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    ports:
      - "3000:80"
    depends_on:
      web:
        condition: service_healthy

volumes:
  postgres-data:
