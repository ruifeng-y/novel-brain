name: novel-brain-m0

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: novelbrain
      POSTGRES_USER: novelbrain
      POSTGRES_PASSWORD: novelbrain
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U novelbrain -d novelbrain"]
      interval: 5s
      timeout: 3s
      retries: 12

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  mailpit:
    image: axllent/mailpit:v1.33.0
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_HTTP_PORT:-8025}:8025"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8025/api/v1/info"]
      interval: 5s
      timeout: 3s
      retries: 12

  minio:
    image: bitnamilegacy/minio:2025.7.23-debian-12-r5
    environment:
      MINIO_ROOT_USER: ${STORAGE_ACCESS_KEY_ID:-novelbrain}
      MINIO_ROOT_PASSWORD: ${STORAGE_SECRET_ACCESS_KEY:-novelbrain-storage-secret}
      MINIO_PROMETHEUS_AUTH_TYPE: public
    ports:
      - "127.0.0.1:${MINIO_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/bitnami/minio/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9000/minio/health/live || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 15s

  minio-init:
    image: bitnamilegacy/minio-client:2025.7.21-debian-12-r3
    entrypoint:
      [
        "/bin/bash",
        "-c",
        'for attempt in $$(seq 1 30); do if mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"; then break; fi; if [ "$$attempt" = "30" ]; then exit 1; fi; sleep 2; done; mc mb --ignore-existing "local/$${STORAGE_BUCKET}"',
      ]
    environment:
      MINIO_ROOT_USER: ${STORAGE_ACCESS_KEY_ID:-novelbrain}
      MINIO_ROOT_PASSWORD: ${STORAGE_SECRET_ACCESS_KEY:-novelbrain-storage-secret}
      STORAGE_BUCKET: ${STORAGE_BUCKET:-novelbrain}
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"

  fake-ai-smoke:
    profiles: ["tools"]
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile
      target: api
    command: ["node", "packages/ai/dist/smoke.js"]
    restart: "no"

  migrate:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile
      target: api
    command: ["node", "packages/db/dist/migrate.js"]
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://novelbrain:novelbrain@postgres:5432/novelbrain}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile
      target: api
    environment:
      NODE_ENV: development
      API_PORT: 3001
      DATABASE_URL: ${DATABASE_URL:-postgresql://novelbrain:novelbrain@postgres:5432/novelbrain}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      AUTH_SECRET: local-development-auth-secret-change-me
      PROXY_IP_SECRET: local-development-proxy-ip-secret
      ALLOW_INSECURE_LOCAL_PROXY_IP: "true"
      APP_ORIGIN: http://localhost:3000
      COOKIE_SECURE: "false"
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      MAIL_FROM: 墨舟 <no-reply@novelbrain.local>
      MODEL_CONFIG_ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef
      ALLOW_INSECURE_LOCAL_MODEL_KEY: "true"
      MODEL_PROVIDER_ALLOWLIST: https://api.openai.com/v1
      MODEL_CONNECTION_TESTER: fake
      TRACE_MODE: ${TRACE_MODE:-off}
      TRACE_RETENTION_DAYS: ${TRACE_RETENTION_DAYS:-}
      TRACE_ENDPOINT: ${TRACE_ENDPOINT:-}
      LOG_CANARY_VALUES: ${LOG_CANARY_VALUES:-}
      STORAGE_HEALTH_URL: http://minio:9000/minio/health/live
    ports:
      - "127.0.0.1:${API_PORT:-3001}:3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/api/v1/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 20

  worker:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile
      target: worker
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:-postgresql://novelbrain:novelbrain@postgres:5432/novelbrain}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      AI_PROVIDER_MODE: fake
      TRACE_MODE: ${TRACE_MODE:-off}
      TRACE_RETENTION_DAYS: ${TRACE_RETENTION_DAYS:-}
      TRACE_ENDPOINT: ${TRACE_ENDPOINT:-}
      LOG_CANARY_VALUES: ${LOG_CANARY_VALUES:-}
      STORAGE_HEALTH_URL: http://minio:9000/minio/health/live
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "apps/worker/dist/readiness-cli.js"]
      interval: 5s
      timeout: 5s
      retries: 20

  web:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile
      target: web
    environment:
      NODE_ENV: production
      API_INTERNAL_URL: http://api:3001
      PROXY_IP_SECRET: local-development-proxy-ip-secret
      ALLOW_INSECURE_LOCAL_PROXY_IP: "true"
      TRUST_PROXY_HEADERS: "true"
    expose:
      - "3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 20

  caddy:
    image: caddy:2-alpine
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    ports:
      - "${WEB_PORT:-3000}:80"
    depends_on:
      web:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v3.5.0
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    volumes:
      - ../observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../observability/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    depends_on:
      api:
        condition: service_healthy
      minio:
        condition: service_healthy

volumes:
  postgres-data:
  minio-data:
  prometheus-data:
